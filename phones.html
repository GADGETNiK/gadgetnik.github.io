<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>История телефонов</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .phone-list {
            max-width: 700px;
            margin: 0 auto;
            padding: 0;
            list-style: none;
        }
        .phone-item {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            transition: transform 0.2s ease;
        }
        .phone-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }
        .phone-icon {
            font-size: 40px;
            color: #2b2b8b;
            width: 60px;
            text-align: center;
            margin-right: 18px;
            user-select: none;
        }
        .phone-details {
            flex-grow: 1;
        }
        .phone-model {
            font-weight: 700;
            font-size: 1.3em;
            color: #232946;
            margin-bottom: 6px;
        }
        .phone-years {
            color: #616a7a;
            font-style: italic;
        }
        @media (max-width: 600px) {
            .phone-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .phone-icon {
                margin-bottom: 8px;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>История телефонов</h1>
    <nav>
        <a href="index.html">Главная</a>
        <a href="about.html">Обо мне</a>
        <a href="devices.html">Мои устройства</a>
        <a href="contacts.html">Контакты</a>
        <a href="firmwares.html">Сборки Android</a>
        <a href="phones.html">История телефонов</a>
        <a href="pc.html">История ПК</a>
    </nav>
</header>
<div class="container">
    <ul class="phone-list">
        <li class="phone-item">
            <div class="phone-icon">📞</div>
            <div class="phone-details">
                <div class="phone-model">Nokia 1100</div>
                <div class="phone-years">2011–2014</div>
            </div>
        </li>
        <li class="phone-item">
            <div class="phone-icon">📱</div>
            <div class="phone-details">
                <div class="phone-model">Samsung Galaxy Ace</div>
                <div class="phone-years">2014–2017</div>
            </div>
        </li>
        <li class="phone-item">
            <div class="phone-icon">📱</div>
            <div class="phone-details">
                <div class="phone-model">Xiaomi Redmi 5 Plus</div>
                <div class="phone-years">2018–2021</div>
            </div>
        </li>
        <li class="phone-item">
            <div class="phone-icon">📱</div>
            <div class="phone-details">
                <div class="phone-model">Xiaomi Redmi Note 7</div>
                <div class="phone-years">2021–н.в.</div>
            </div>
        </li>
    </ul>
</div>
</body>
</html>
